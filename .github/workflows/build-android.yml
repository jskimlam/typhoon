name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build installable debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk LAM-Typhoon-${GITHUB_REF_NAME}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAM-Typhoon-APK
          path: LAM-Typhoon-${{ github.ref_name }}.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "LAM-Typhoon-${GITHUB_REF_NAME}.apk#LAM Typhoon Android APK"
          --title "LAM Typhoon ${GITHUB_REF_NAME}"
          --notes "기상청 현재 태풍정보, 연도별 태풍 통계와 석유화학 공급망 주의 대시보드를 제공하는 Android 앱입니다. 이 APK는 테스트 설치용 디버그 서명 빌드입니다."

